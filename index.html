<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"

</head>

<body>

    <div class="container py-4">

        <!-- Demostración 1: Saludar -->
        <div class="mb-4">
            <h2 class="fw-bold">Demostración 1: Saludar</h2>

            <div class="col-8">
                <label for="">Ingrese su nombre</label>
                <input class="form-control" id="input" type="text">
                <button class="btn btn-primary mt-2" id="boton">Saludar</button>
                <p id="text" class="mt-2"></p>
            </div>
        </div>

        <!-- Demostración 2: Contador -->
        <div class="mb-4">
            <h2 class="fw-bold">Demostración 2: Contador</h2>

            <div class="col-8">
                <button class="btn btn-primary" id="boton-2">Añadir</button>
                <button class="btn btn-danger" id="reiniciar">Reiniciar</button>
                <p id="cont" class="mt-2">Cuenta: 0</p>
            </div>
        </div>

        <!-- Demostración 3: Texto simultáneo -->
        <div class="mb-4">
            <h2 class="fw-bold">Demostración 3: Texto simultáneo</h2>

            <div class="col-8">
                <label for="">Ingrese cualquier texto</label>
                <input class="form-control" id="simultaneo" type="text">
                <p id="textSim" class="mt-2"></p>
            </div>
        </div>

        <!-- Demostración 4: Cambiar color -->
        <div class="mb-4">
            <h2 class="fw-bold">Demostración 4: Cambiar color</h2>

            <div class="col-8">
                <select id="select" class="form-select" aria-label="Default select example">
                    <option selected>Open this select menu</option>
                    <option value="1">Azul</option>
                    <option value="2">Verde</option>
                    <option value="3">Amarillo</option>
                    <option value="4">Rosa</option>
                </select>

                <div id="card" class="card mt-2"></div>
            </div>
        </div>

        <!-- Demostración 5: Formulario e IMC -->
        <div class="mb-4">
            <h2 class="fw-bold">Demostración 6: Formulario y cálculo de IMC</h2>

            <div class="col-8">
                <form class="form form-control" id="form" action="">
                    <label for="">Ingrese su peso</label>
                    <input class="form-control" type="number" id="peso" placeholder="Peso">

                    <label for="" class="mt-2">Ingrese su altura</label>
                    <input class="form-control" type="number" id="altura" placeholder="Altura">

                    <button class="btn btn-primary mt-3" id="calcular">Calcular IMC</button>
                    <p id="imc" class="mt-2"></p>
                </form>
            </div>
        </div>
        <div class="mb-4">
            <h2 class="fw-bold">Demostración 7: Contraseña</h2>

            <div class="col-8">
                <label for="">Ingrese su contraseña</label>
                <input class="form-control" id="contraseña" type="password">
                <p id="contraseña-text" class="mt-2"></p>
            </div>
        </div>
        <div class="mb-4">
            <h2 class="fw-bold">Demostración 8: Lista de mercado</h2>
            <input class="form-control" id="item" type="text" placeholder="Ingrese un item">
            <button class="btn btn-primary mt-2" id="agregar">Agregar</button>
        <ul id="lista" class="mt-2">
        </ul>

            
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>

    <script src="./index.js"></script>

</body>

</html>
